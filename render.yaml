services:
  # ── Backend (Express API) ──────────────────────────────
  - type: web
    name: holystudio-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false          # set manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "HOLYSTUDIO <noreply@holystudio.ai>"
      - key: CRON_SECRET
        sync: false
      - key: SITE_URL
        value: "https://holystudio.ai"
      - key: COURSE_PRICE_UAH
        value: "490"
      - key: WFP_MERCHANT_LOGIN
        sync: false
      - key: WFP_MERCHANT_SECRET
        sync: false
      - key: WFP_MERCHANT_PASSWORD
        sync: false
      - key: API_URL
        fromService:
          type: web
          name: holystudio-api
          property: host        # auto-resolves to https://holystudio-api.onrender.com

  # ── Frontend (React / Vite static site) ────────────────
  - type: web
    name: holystudio-web
    runtime: static
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: holystudio-api
          property: host        # e.g. https://holystudio-api.onrender.com
      - key: COURSE_PRICE_UAH
        value: "490"

